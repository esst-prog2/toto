[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toto-estimator"
version = "0.1.0"
description = "A transparent synthetic-data MVP for 13+1 Toto predictions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1.0",
    "pandas>=2.2.3",
    "streamlit>=1.49.0",
    "Jinja2>=3.1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src", "."]

